[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-drawdown"
version = "1.0.0"
description = "Tech Drawdown dashboard pipeline (scripts/, not an importable library)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "openpyxl>=3.1",
    "graphviz>=0.20",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests/scripts"]
pythonpath = ["scripts"]
